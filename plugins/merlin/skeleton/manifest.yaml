# Business folder manifest. Merlin's skills read this file.
# `name` is your business name. You may change it. Leave the task_lists block as it is.
name: My Business

# Projects Merlin manages. Project setup replaces the empty [] with entries like:
#   - name: Website
#     path: Website
projects: []

# One task list for the whole folder: TASKS.md, beside this file.
# The task engine reads this block. "pre-cut" is the engine's single-list mode.
task_lists:
  state: pre-cut
  frozen_ledger: ./TASKS.md
