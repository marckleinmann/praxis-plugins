# Merlin's HQ manifest. Merlin's skills read this file.
# This folder is Merlin's HQ: it holds Merlin's own files, and your projects sit beside it in
# your business folder. The `kind: merlin-hq` line is how Merlin finds this folder; leave it as it is.
# `name` is your business name. You may change it. Leave the task_lists block as it is.
name: My Business
kind: merlin-hq

# Projects Merlin manages. Each project is a folder in your business folder, beside this HQ
# folder. Project setup replaces the empty [] with entries like:
#   - name: Website
#     path: ../Website
projects: []

# One task list for the whole business: live/TASKS.md in this HQ folder.
# The task engine reads this block. "pre-cut" is the engine's single-list mode.
task_lists:
  state: pre-cut
  frozen_ledger: ./live/TASKS.md
  rollup: ./live/task-rollup.md
